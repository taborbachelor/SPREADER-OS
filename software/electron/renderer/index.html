<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://localhost:8765">
  <title>Spreader OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Status Bar ──────────────────────────────────────────────────────── -->
  <div id="status-bar">
    <div class="status-group">
      <div class="status-indicator">
        <div class="status-dot" id="gps-dot"></div>
        <span id="gps-status-text" style="color:var(--text-secondary)">GPS · Disconnected</span>
        <button class="connect-btn" id="btn-connect-gps" onclick="openPortPicker('gps')">CONNECT</button>
      </div>
      <div class="status-indicator">
        <div class="status-dot" id="scale-dot"></div>
        <span id="scale-status-text" style="color:var(--text-secondary)">Scale · Disconnected</span>
        <button class="connect-btn" id="btn-connect-scale" onclick="openPortPicker('scale')">CONNECT</button>
      </div>
      <span class="sim-badge" id="sim-badge" style="display:none">SIM</span>
    </div>
    <div class="status-group">
      <span id="app-version" style="color:var(--text-label);font-size:11px"></span>
      <span id="clock"></span>
    </div>
  </div>

  <!-- ── Main Layout ─────────────────────────────────────────────────────── -->
  <div id="main">
    <!-- Panel 1: Live Metrics -->
    <div class="panel" id="panel-metrics">
      <div class="panel-header">Live</div>

      <div class="metric-block" id="metric-weight">
        <div class="metric-label">WEIGHT</div>
        <div class="metric-value" id="display-weight">—<span class="metric-unit">lbs</span></div>
      </div>

      <div class="metric-block" id="metric-rate">
        <div class="metric-label">RATE</div>
        <div class="metric-value" id="display-rate">—<span class="metric-unit">lbs/ac</span></div>
        <div class="metric-target" id="display-rate-target"></div>
      </div>

      <div class="metric-block">
        <div class="metric-label">SPEED</div>
        <div class="metric-value" id="display-speed">—<span class="metric-unit">mph</span></div>
      </div>

      <div class="metric-block">
        <div class="metric-label">LOAD</div>
        <div class="metric-value" id="display-tons-left">—<span class="metric-unit">tons</span></div>
      </div>

      <div class="divider"></div>

      <button class="btn btn-tare" id="btn-tare">TARE</button>
      <button class="btn btn-settings" onclick="openSettings()">⚙ Settings</button>
    </div>

    <!-- Panel 2: Coverage Map -->
    <div class="panel" id="panel-map">
      <div class="panel-header">Coverage Map</div>
      <canvas id="coverage-canvas"></canvas>
    </div>

    <!-- Panel 3: Job -->
    <div class="panel" id="panel-job">
      <div class="panel-header">Job</div>

      <div class="job-row">
        <span class="metric-label">TARGET</span>
        <span id="display-target-rate" class="job-value">—<span class="metric-unit">lbs/ac</span></span>
      </div>
      <div class="job-row">
        <span class="metric-label">TIMER</span>
        <span id="display-timer" class="job-value">—</span>
      </div>
      <div class="job-row">
        <span class="metric-label">APPLIED</span>
        <span id="display-applied" class="job-value">—<span class="metric-unit">lbs</span></span>
      </div>
      <div class="job-row">
        <span class="metric-label">ACRES</span>
        <span id="display-acres" class="job-value">—</span>
      </div>
      <div class="job-row">
        <span class="metric-label">AVG RATE</span>
        <span id="display-avg-rate" class="job-value">—<span class="metric-unit">lbs/ac</span></span>
      </div>

      <div class="divider"></div>

      <button class="btn btn-job" id="btn-job" onclick="toggleJob()">START JOB</button>
      <button class="btn btn-history" onclick="openHistory()">☰ History</button>
    </div>
  </div>

  <!-- ── Section Bar ─────────────────────────────────────────────────────── -->
  <div id="section-bar">
    <span class="section-bar-label">Sections</span>
    <div id="sections-container"></div>
    <div class="asc-control">
      <span class="asc-label">ASC</span>
      <label class="toggle">
        <input type="checkbox" id="asc-toggle" checked onchange="settings.asc_enabled = this.checked">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>
  </div>

  <!-- ── Port Picker Modal ────────────────────────────────────────────────── -->
  <div class="overlay" id="port-picker-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header" id="port-picker-title">Select Port</div>
      <div id="port-list" class="port-list"></div>
      <div class="modal-row">
        <label class="metric-label">BAUD</label>
        <select id="port-baud" class="baud-select">
          <option value="19200">19200</option>
          <option value="9600">9600</option>
          <option value="115200">115200</option>
          <option value="4800">4800</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closePortPicker()">Cancel</button>
        <button class="btn btn-job" id="btn-port-connect" onclick="confirmPortConnect()">Connect</button>
      </div>
    </div>
  </div>

  <!-- ── Settings Panel ──────────────────────────────────────────────────── -->
  <div class="side-panel" id="settings-panel" style="display:none">
    <div class="side-panel-header">
      <span>Settings</span>
      <button onclick="closeSettings()" style="background:none;border:none;color:var(--text-secondary);font-size:18px;cursor:pointer">✕</button>
    </div>
    <div class="side-panel-body">
      <label class="setting-label">Target Rate (lbs/ac)</label>
      <input class="setting-input" id="set-target-rate" type="number" min="0" max="5000" value="500">
      <label class="setting-label">Spread Width (ft)</label>
      <input class="setting-input" id="set-spread-width" type="number" min="1" max="120" value="50">
      <label class="setting-label">Section Count</label>
      <input class="setting-input" id="set-section-count" type="number" min="1" max="20" value="10">
      <label class="setting-label">Section Width (ft)</label>
      <input class="setting-input" id="set-section-width" type="number" min="1" max="20" value="5">
      <label class="setting-label">ASC Overlap Threshold (%)</label>
      <input class="setting-input" id="set-asc-threshold" type="number" min="0" max="100" value="50">
      <label class="setting-label">Min Operating Speed (mph)</label>
      <input class="setting-input" id="set-min-speed" type="number" min="0" max="5" step="0.1" value="0.3">
      <button class="btn btn-job" onclick="applySettings()">Apply</button>
    </div>
  </div>

  <!-- ── History Panel ───────────────────────────────────────────────────── -->
  <div class="side-panel" id="history-panel" style="display:none">
    <div class="side-panel-header">
      <span>Job History</span>
      <button onclick="closeHistory()" style="background:none;border:none;color:var(--text-secondary);font-size:18px;cursor:pointer">✕</button>
    </div>
    <div class="side-panel-body">
      <div id="history-list"></div>
      <button class="btn btn-tare" onclick="exportAllJobs()">EXPORT ALL (JSON)</button>
    </div>
  </div>

  <!-- ── Job Summary Modal ────────────────────────────────────────────────── -->
  <div class="overlay" id="job-summary-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">Job Complete</div>
      <div class="summary-grid">
        <span class="metric-label">Applied</span> <span id="summary-lbs" class="summary-val"></span>
        <span class="metric-label">Tons</span>     <span id="summary-tons" class="summary-val"></span>
        <span class="metric-label">Acres</span>    <span id="summary-acres" class="summary-val"></span>
        <span class="metric-label">Avg Rate</span> <span id="summary-rate" class="summary-val"></span>
        <span class="metric-label">Duration</span> <span id="summary-time" class="summary-val"></span>
      </div>
      <input class="setting-input" id="summary-field-name" type="text" placeholder="Field name (optional)">
      <div class="modal-actions">
        <button class="btn btn-job" onclick="saveAndCloseJob()">Save & Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
